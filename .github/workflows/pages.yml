name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chess-bet/web/package-lock.json
      - run: npm ci
        working-directory: chess-bet/web
      - run: npm run build
        working-directory: chess-bet/web
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: /-hessbet
          NEXT_PUBLIC_THIRDWEB_CLIENT_ID: fc1b95eb7453e110e8e2007b00301f0e
          NEXT_PUBLIC_CHAIN_ID: "80002"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chess-bet/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
